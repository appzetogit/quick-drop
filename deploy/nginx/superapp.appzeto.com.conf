# master super-app (food + taxi + service-provider) -> 127.0.0.1:5007
#
# Modelled on k9-api.conf, which fronts the LIVE pre-integration build on 5005.
# This is a separate server block, separate domain, separate upstream; it does not
# touch that one.
#
# client_max_body_size is 50M rather than k9-api.conf's 25M because the
# service-provider module accepts larger uploads (its standalone server used a
# 50mb body limit).
#
# Installed to /etc/nginx/sites-available/ and symlinked into sites-enabled.
# Certbot appends the ssl listener and the :80 -> :443 redirect on first issue.
server {
    listen 80;
    listen [::]:80;
    server_name superapp.appzeto.com;

    client_max_body_size 50M;

    # Socket.IO. Master uses the default namespace, service-provider uses /sp;
    # both ride the same /socket.io/ path, so one location covers them.
    location /socket.io/ {
        proxy_pass http://127.0.0.1:5007/socket.io/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:5007/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /uploads/ {
        proxy_pass http://127.0.0.1:5007/uploads/;
        proxy_set_header Host $host;
    }

    location /health {
        proxy_pass http://127.0.0.1:5007/health;
        proxy_set_header Host $host;
    }
}
