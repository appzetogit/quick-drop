# master super-app (food + taxi + service-provider) -> 127.0.0.1:5007
#
# Modelled on k9-api.conf, which fronts the LIVE pre-integration build on 5005.
# This is a separate server block, separate domain, separate upstream; it does not
# touch that one.
#
# client_max_body_size is 50M rather than k9-api.conf's 25M because the
# service-provider module accepts larger uploads (its standalone server used a
# 50mb body limit).
#
# Installed to /etc/nginx/sites-available/ and symlinked into sites-enabled.
# Certbot appends the ssl listener and the :80 -> :443 redirect on first issue.
server {
    listen 80;
    listen [::]:80;
    server_name superapp.appzeto.com;

    client_max_body_size 50M;

    # Socket.IO. Master uses the default namespace, service-provider uses /sp;
    # both ride the same /socket.io/ path, so one location covers them.
    location /socket.io/ {
        proxy_pass http://127.0.0.1:5007/socket.io/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:5007/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Uploaded media, served straight off disk. This used to proxy to Node, which
    # has no static mount for the directory -- every uploaded image 404'd even
    # though the file was written fine. Static files belong to nginx anyway; the
    # other apps on this box (quick-commerce) do exactly this.
    #
    # The root must match UPLOAD_STORAGE_ROOT in the app's .env: the storage
    # service resolves to /var/www/uploads in production.
    location /uploads/ {
        alias /var/www/uploads/;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        add_header Access-Control-Allow-Origin "*";
        try_files $uri =404;
    }

    location /health {
        proxy_pass http://127.0.0.1:5007/health;
        proxy_set_header Host $host;
    }
}
